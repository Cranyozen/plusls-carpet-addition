name: Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew --no-daemon clean build

      - name: Find distributable JAR
        id: artifact
        shell: bash
        run: |
          mapfile -t artifacts < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          if [[ "${#artifacts[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one distributable JAR in build/libs; found ${#artifacts[@]}."
            printf '%s\n' "${artifacts[@]}"
            exit 1
          fi
          echo "path=${artifacts[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
