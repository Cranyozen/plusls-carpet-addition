name: Publish

on:
  workflow_call:
    inputs:
      publish_target_release_tag:
        description: Existing GitHub release tag to upload the build artifact to
        type: string
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build-artifacts

      - name: Upload artifact to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.publish_target_release_tag }}
        run: |
          mapfile -t artifacts < <(find build-artifacts -maxdepth 1 -type f -name '*.jar' | sort)
          if [[ "${#artifacts[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one build JAR; found ${#artifacts[@]}."
            printf '%s\n' "${artifacts[@]}"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${artifacts[0]}" --clobber
