name: CI

on:
  push:
    paths:
      - ".github/workflows/**"
      - "LICENSE"
      - "build.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "icon.png"
      - "settings.gradle"
      - "src/**"
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish_target_release_tag:
        description: Existing GitHub release tag to upload the build artifact to
        type: string
        required: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_target_release_tag != '') }}
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      publish_target_release_tag: ${{ github.event.release.tag_name || inputs.publish_target_release_tag }}
