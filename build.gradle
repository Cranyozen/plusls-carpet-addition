plugins {
    // Minecraft 26.3 ships unobfuscated: "net.fabricmc.fabric-loom" is the no-remap Loom plugin.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
    maven {
        name = "Nyan Maven Releases"
        url = "https://maven.hendrixshen.top/releases"
    }

    maven {
        name = "NyanMaven Mirror"
        url = "https://maven.hendrixshen.top/mirror"
    }

    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"

        content {
            includeGroup "maven.modrinth"
        }
    }

    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Carpet mod: rule system, BlockRotator, EntityPlayerMPFake
    implementation "maven.modrinth:carpet:${carpet_version}"

    // MagicLib: the Modrinth bundle only nests module jars, so compile against the modules themselves
    compileOnly "top.hendrixshen.magiclib:magiclib-core-fabric:0.8.163"
    compileOnly "top.hendrixshen.magiclib:magiclib-minecraft-api-26.3-fabric:0.6.114"
    compileOnly "top.hendrixshen.magiclib:magiclib-legacy-compat-26.3-fabric:0.8.58"
    runtimeOnly "maven.modrinth:magiclib:${magiclib_version}"
}

group = project.property("mod.maven_group")
version = "${project.property('mod.version')}-${project.minecraft_version}"
base {
    archivesName = "${project.property('mod.archives_base_name')}-${project.minecraft_version}"
}

loom {
    accessWidenerPath = file("${rootDir}/src/main/resources/${project.property('mod.id')}.accesswidener")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

processResources {
    outputs.upToDateWhen { false }

    from("${rootDir}/icon.png") {
        into("assets/${project.property('mod.id')}")
    }

    filesMatching("fabric.mod.json") {
        filter { line ->
            line.trim().startsWith("//") ? null : line
        }

        expand([
                "version"         : project.version,
                "minecraft_dependency": project.minecraft_dependency
        ])
    }
}

jar {
    from("${rootDir}/LICENSE")
}
